[pytest]
pythonpath = .
testpaths = tests eval
# Testes que chamam o LLM de verdade custam dinheiro: ficam de fora por padrão.
# Para rodá-los: pytest -m llm
addopts = -m "not llm"
markers =
    llm: chama a API do LLM de verdade (precisa de chave no .env e tem custo)
    modelo_real: usa o modelo de embeddings de verdade (offline, sem custo; mais lento)
filterwarnings =
    ignore::DeprecationWarning
